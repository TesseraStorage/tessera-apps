<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera</title>
<style>
  body { background: #080c12; color: #e2e8f0; margin: 0; }
  .boot-spinner {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; font-family: system-ui, sans-serif;
    color: #64748b; font-size: 14px;
  }
  .boot-spinner::before {
    content: ''; width: 18px; height: 18px;
    border: 2px solid #1e2d3d; border-top-color: #06b6d4;
    border-radius: 50%; margin-right: 10px;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app-root" class="boot-spinner">Loading Tessera\u2026</div>
<script type="module">
  import { mountApp } from '@tessera/shared'
  import '@tessera/shared/style.css'
  mountApp('#app-root')
</script>
</body>
</html>
