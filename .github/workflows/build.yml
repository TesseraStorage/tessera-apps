name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Web app (WASM-based, no native deps) ─────────────────
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-web
          path: apps/web/dist

  # ── Desktop app (Electron + native per platform) ─────────
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            electron-arch: ''
            artifact: tessera-linux-x64

          # Apple Silicon (arm64) — macos-latest is currently macos-14
          - os: macos-latest
            target: mac
            electron-arch: '--arm64'
            artifact: tessera-macos-arm64

          # Intel Mac (x64)
          - os: macos-26-intel
            target: mac
            electron-arch: '--x64'
            artifact: tessera-macos-x64

          - os: windows-latest
            target: win
            electron-arch: ''
            artifact: tessera-win-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Debug toolchain
        shell: bash
        run: |
          echo "=== electron ==="
          npx electron --version 2>&1 || true
          echo "=== electron-builder ==="
          npx electron-builder --version 2>&1 || true
          echo "=== app-builder-bin ==="
          node -e "console.log(require('app-builder-bin').appBuilderPath)" 2>&1 || true
          ls -la "$(node -e "console.log(require('app-builder-bin').appBuilderPath)")" 2>&1 || true
          echo "=== sia-storage native ==="
          ls node_modules/@siafoundation/ 2>&1 || true

      - name: Build Vite frontend
        run: npm run build:desktop

      - name: Package Electron app (${{ matrix.target }} ${{ matrix.electron-arch }})
        shell: bash
        run: |
          cd apps/desktop
          npx electron-builder --${{ matrix.target }} ${{ matrix.electron-arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Only the final distributable binaries — never the unpacked
          # directories (mac-*, win-unpacked, linux-unpacked) or .blockmap
          # files, which is what flooded the release with 100+ junk assets.
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.rpm
            apps/desktop/dist-electron/*.exe
          if-no-files-found: error

  # ── GitHub Release (tag pushes only) ─────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-web, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tessera-*
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Exactly the 5 distributables: deb, AppImage, win exe, and
          # the two macOS dmg files. Nothing else.
          files: |
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.exe
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
